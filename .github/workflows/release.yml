name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/kwb_comfort4/manifest.json > m.json
          mv m.json custom_components/kwb_comfort4/manifest.json
      - name: Zip integration
        run: cd custom_components/kwb_comfort4 && zip -r ../../kwb_comfort4.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: kwb_comfort4.zip
