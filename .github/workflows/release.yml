name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version from tag
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          version="${tag#v}"
          jq --arg v "$version" '.version = $v' custom_components/kwb_comfort4/manifest.json > m.json
          mv m.json custom_components/kwb_comfort4/manifest.json
      - name: Zip integration
        run: cd custom_components/kwb_comfort4 && zip -r ../../kwb_comfort4.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: kwb_comfort4.zip
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
