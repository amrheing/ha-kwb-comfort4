add_purchase:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kwb_comfort4
    date:
      required: true
      selector:
        date:
    amount_kg:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: kg
          mode: box
    price_per_t:
      selector:
        number:
          min: 0
          max: 2000
          step: 0.01
          unit_of_measurement: EUR/t
          mode: box
    total_price:
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          unit_of_measurement: EUR
          mode: box
    note:
      selector:
        text:
    add_to_stock:
      default: false
      selector:
        boolean:
delete_purchase:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kwb_comfort4
    date:
      required: true
      selector:
        date:
list_purchases:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: kwb_comfort4
